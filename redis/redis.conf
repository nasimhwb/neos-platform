# ==============================================================================
# REDIS CACHE PRODUCTION CONFIGURATION
# ==============================================================================

# Network Settings
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# General Settings
daemonize no
supervised no
loglevel notice
databases 16
always-show-logo yes

# ==============================================================================
# SNAPSHOTTING (RDB Persistence)
# ==============================================================================
# Save the DB on disk:
#   save <seconds> <changes>
save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ==============================================================================
# APPEND ONLY MODE (AOF Persistence)
# ==============================================================================
# RDB + AOF is the recommended setup for maximum durability
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# ==============================================================================
# LIMITS & CACHE POLICY
# ==============================================================================
# These settings can also be overridden via docker command-line args.
maxclients 10000

# Recommended memory limits for a shared 4GB RAM VPS:
# maxmemory 512mb
# maxmemory-policy allkeys-lru

# ==============================================================================
# SECURITY
# ==============================================================================
# Rename or disable high-risk commands that shouldn't be executed in production
rename-command FLUSHDB "FLUSHDB_DANGER"
rename-command FLUSHALL "FLUSHALL_DANGER"
rename-command KEYS "KEYS_DANGER"
rename-command SHUTDOWN "SHUTDOWN_DANGER"
rename-command CONFIG "CONFIG_DANGER"
