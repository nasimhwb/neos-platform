version: '3.8'

networks:
  frontend:
    name: neos_frontend
    driver: bridge
  backend:
    name: neos_backend
    driver: bridge

volumes:
  postgres_data:
    name: neos_postgres_data
  redis_data:
    name: neos_redis_data
  minio_data:
    name: neos_minio_data
  prometheus_data:
    name: neos_prometheus_data
  grafana_data:
    name: neos_grafana_data
  loki_data:
    name: neos_loki_data

services:
  # ------------------------------------------------------------------------------
  # Database Service (PostgreSQL)
  # ------------------------------------------------------------------------------
  db:
    image: postgres:${POSTGRES_VERSION:-16.3-alpine}
    container_name: neos_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    networks:
      - backend
    # No ports exposed to host. Secure by default.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------------------
  # Cache Service (Redis)
  # ------------------------------------------------------------------------------
  cache:
    image: redis:${REDIS_VERSION:-7.2-alpine}
    container_name: neos_redis
    restart: always
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass "${REDIS_PASSWORD}"
      --maxmemory "${REDIS_MAXMEMORY:-512mb}"
      --maxmemory-policy "${REDIS_MAXMEMORY_POLICY:-allkeys-lru}"
    networks:
      - backend
    # No ports exposed to host. Secure by default.
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------------------
  # Object Storage (MinIO)
  # ------------------------------------------------------------------------------
  object-store:
    image: minio/minio:${MINIO_VERSION:-RELEASE.2024-06-06T09-36-42Z}
    container_name: neos_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - frontend
      - backend
    # No ports exposed directly. Proxied by Nginx.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------------------
  # Reverse Proxy (Nginx + SSL Placeholder/Certbot)
  # ------------------------------------------------------------------------------
  reverse-proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: neos_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /srv/neos/letsencrypt:/etc/letsencrypt
      - /srv/neos/www:/var/www/html
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      object-store:
        condition: service_healthy

  # ------------------------------------------------------------------------------
  # Monitoring: Prometheus
  # ------------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v2.52.0}
    container_name: neos_prometheus
    restart: always
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - backend
    depends_on:
      - node-exporter

  # ------------------------------------------------------------------------------
  # Monitoring: Node Exporter (Host Metrics)
  # ------------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: neos_node_exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - backend

  # ------------------------------------------------------------------------------
  # Logging: Grafana Loki
  # ------------------------------------------------------------------------------
  loki:
    image: grafana/loki:${LOKI_VERSION:-3.0.0}
    container_name: neos_loki
    restart: always
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - backend

  # ------------------------------------------------------------------------------
  # Logging Agent: Promtail (Log Shipper)
  # ------------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:${PROMTAIL_VERSION:-3.0.0}
    container_name: neos_promtail
    restart: always
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      # Promtail reads docker container logs from VPS host
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - backend
    depends_on:
      - loki

  # ------------------------------------------------------------------------------
  # Observability Dashboards (Grafana)
  # ------------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-11.0.0}
    container_name: neos_grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - frontend
      - backend
    depends_on:
      - prometheus
      - loki
