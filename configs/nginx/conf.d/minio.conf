# ==============================================================================
# MINIO S3 API & CONSOLE PROXY CONFIGURATION
# ==============================================================================

# 1. MinIO API Proxy
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name s3.neos-platform.local; # Managed by ${MINIO_API_SUBDOMAIN}

    ssl_certificate /etc/letsencrypt/live/neos-platform.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neos-platform.local/privkey.pem;

    # To allow large file uploads to S3
    ignore_invalid_headers off;
    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300;
        # Default is HTTP/1, but keepalive is only enabled in HTTP/1.1
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;

        # Point to the Compose container name and API port
        proxy_pass http://neos_minio:9000; 
    }
}

# 2. MinIO Console Proxy (Web Admin UI)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name s3-console.neos-platform.local; # Managed by ${MINIO_CONSOLE_SUBDOMAIN}

    ssl_certificate /etc/letsencrypt/live/neos-platform.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neos-platform.local/privkey.pem;

    ignore_invalid_headers off;
    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets support for Console UI terminal/logs
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_http_version 1.1;
        proxy_connect_timeout 300;

        # Point to the Compose container name and Console port
        proxy_pass http://neos_minio:9001;
    }
}
