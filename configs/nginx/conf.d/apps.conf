# ==============================================================================
# NEOS PLATFORM - APPLICATION PROXY CONFIGURATIONS
# ==============================================================================
# This file defines the reverse proxy configurations for each application.
# SSL configurations are defined using standard certificate paths on the VPS.
# Run setup-vps.sh to generate placeholders/SSL certs before restarting Nginx.

# Common proxy parameters helper
# (Included in server blocks)
# proxy_set_header Host $host;
# proxy_set_header X-Real-IP $remote_addr;
# proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# proxy_set_header X-Forwarded-Proto $scheme;

# ------------------------------------------------------------------------------
# 1. NEOS ERP
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name erp.neos-platform.local; # Managed by ${ERP_SUBDOMAIN}

    ssl_certificate /etc/letsencrypt/live/neos-platform.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neos-platform.local/privkey.pem;

    # ERP Backend Service Placeholder
    # This points to the Docker service name if deployed in the same network
    location / {
        # proxy_pass http://neos_erp_app:8000;
        # proxy_http_version 1.1;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
        # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # proxy_set_header X-Forwarded-Proto $scheme;

        # Static placeholder for testing
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =503; # Returns service unavailable if backend is not set
    }
}

