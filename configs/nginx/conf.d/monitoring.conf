# ==============================================================================
# GRAFANA MONITORING DASHBOARD PROXY CONFIGURATION
# ==============================================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name monitor.neos-platform.local; # Managed by ${MONITORING_SUBDOMAIN}

    ssl_certificate /etc/letsencrypt/live/neos-platform.local/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neos-platform.local/privkey.pem;

    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets support for Grafana live panels
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_http_version 1.1;
        proxy_connect_timeout 300;

        # Point to the Compose container name and Grafana port
        proxy_pass http://neos_grafana:3000;
    }
}
