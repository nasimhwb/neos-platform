server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. Scrape system logs (syslog, auth.log etc) from the host VPS
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          host: vps-host
          __path__: /var/log/*log

  # 2. Scrape Docker Container Logs directly from the JSON files on host
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker-containers
          host: vps-host
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      # Parse docker JSON log format
      - json:
          expressions:
            log: log
            stream: stream
            time: time
      
      # Extract container ID from the filepath
      - regex:
          expression: "/var/lib/docker/containers/(?P<container_id>[a-f0-9]+)/(?P<container_id_full>[a-f0-9]+)-json.log"
          source: __path__

      # Set timestamp from the log line
      - timestamp:
          source: time
          format: RFC3339

      # Set the parsed log as the final output message
      - output:
          source: log
