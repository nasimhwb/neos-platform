# ==============================================================================
# TRAEFIK V3 STATIC CONFIGURATION
# ==============================================================================

global:
  checkNewVersion: false
  sendAnonymousUsage: false

# 1. Entrypoints
entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: :443
    http3:
      # Enable HTTP/3 (QUIC) over UDP port 443
      advertisedPort: 443
    http:
      tls:
        certResolver: letsencrypt

  traefik:
    address: :8082

# 2. Providers
providers:
  docker:
    endpoint: unix:///var/run/docker.sock
    exposedByDefault: false
    network: neos-public
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

# 3. Administrative Interface & Healthcheck
api:
  dashboard: true
  insecure: false

ping:
  entryPoint: traefik

# 4. Metrics & Scraping
metrics:
  prometheus:
    entryPoint: traefik
    buckets: [0.1, 0.3, 1.2, 5.0]
    addEntryPointsLabels: true
    addServicesLabels: true

# 5. Automated Certificates Management (Let's Encrypt ACME)
certificatesResolvers:
  letsencrypt:
    acme:
      email: admin@neos-platform.local
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

# 6. Logging
log:
  level: INFO
  format: common

accessLog:
  format: common
  filters:
    statusCodes: ["400-599"] # Log warning/error client traffic
