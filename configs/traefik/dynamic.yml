# ==============================================================================
# TRAEFIK V3 DYNAMIC CONFIGURATION & MIDDLEWARES
# ==============================================================================

http:
  # ----------------------------------------------------------------------------
  # Middlewares definitions
  # ----------------------------------------------------------------------------
  middlewares:
    # 1. Global Production Security Headers
    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        forceSTSHeader: true
        stsSeconds: 31536000 # 1 year HSTS
        stsIncludeSubdomains: true
        stsPreload: true
        referrerPolicy: "strict-origin-when-cross-origin"
        contentSecurityPolicy: "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; img-src 'self' data: https:; child-src 'self' blob:; connect-src 'self' wss: https:;"

    # 2. Gzip Compression
    compression:
      compress: {}

    # 3. Rate Limiting Middleware
    rate-limit:
      rateLimit:
        average: 100
        burst: 200

    # 4. Traefik Dashboard Protection (Basic Auth)
    # Credentials: admin / ChangeThisToASuperSecureDashboardPassword123!
    dashboard-auth:
      basicAuth:
        users:
          - "admin:$2y$05$y8.yH77e0340Gf85/n2NSeY4w514h/h9j5cOu349d91e3e7f59d57a"

    # 5. Hostinger Shared Hosting Reverse Proxy Headers
    hostinger-headers:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "https"
          X-Forwarded-Port: "443"
          X-Forwarded-Host: "neosfacility.com"

  # ----------------------------------------------------------------------------
  # Production Ingress Routing
  # ----------------------------------------------------------------------------
  routers:
    # Legacy PHP Application on Hostinger Shared Hosting
    legacy-php-hostinger:
      rule: "Host(`neosfacility.com`, `www.neosfacility.com`) && PathPrefix(`/neos_admin`)"
      entryPoints:
        - websecure
      tls: {}
      priority: 100
      service: hostinger-shared-hosting-service
      middlewares:
        - hostinger-headers@file
        - compression@file

    # VPS Next.js Dashboard UI
    vps-dashboard-router:
      rule: "Host(`neosfacility.com`, `www.neosfacility.com`) && PathPrefix(`/dashboard`)"
      entryPoints:
        - websecure
      tls: {}
      priority: 90
      service: dashboard-ui-service

    # VPS Platform API Routes
    vps-api-router:
      rule: "Host(`neosfacility.com`, `www.neosfacility.com`) && PathPrefix(`/api`)"
      entryPoints:
        - websecure
      tls: {}
      priority: 90
      service: dashboard-ui-service

    # VPS Supabase Auth & Gateway Services
    vps-supabase-auth-router:
      rule: "Host(`neosfacility.com`, `www.neosfacility.com`) && (PathPrefix(`/auth`) || PathPrefix(`/supabase`))"
      entryPoints:
        - websecure
      tls: {}
      priority: 90
      service: supabase-gateway-service

    # VPS Main Web Application Catch-All
    vps-main-app-router:
      rule: "Host(`neosfacility.com`, `www.neosfacility.com`)"
      entryPoints:
        - websecure
      tls: {}
      priority: 10
      service: dashboard-ui-service

    # Staging Subdomain App
    test-staging-router:
      rule: "Host(`test.neosfacility.com`)"
      entryPoints:
        - websecure
      tls: {}
      priority: 100
      service: test-staging-service
      middlewares:
        - security-headers@file
        - compression@file

    # Canary / Subdomain Apps
    neos-app-production:
      rule: "HostRegexp(`app\\..+`)"
      entryPoints:
        - websecure
      tls: {}
      service: neos-app-production-service
      middlewares:
        - security-headers@file
        - compression@file
        - rate-limit@file

  # ----------------------------------------------------------------------------
  # Upstream Services Configurations
  # ----------------------------------------------------------------------------
  services:
    test-staging-service:
      loadBalancer:
        servers:
          - url: "http://neos_app:3000"
        passHostHeader: true
    # Hostinger Shared Hosting Upstream (Legacy PHP Application)
    hostinger-shared-hosting-service:
      loadBalancer:
        servers:
          - url: "https://legacy.neosfacility.com"
        passHostHeader: true
        responseForwarding:
          flushInterval: "100ms"

    # VPS Next.js Dashboard Service
    dashboard-ui-service:
      loadBalancer:
        servers:
          - url: "http://neos_dashboard:3000"
        passHostHeader: true

    # VPS Supabase Ingress Gateway Service
    supabase-gateway-service:
      loadBalancer:
        servers:
          - url: "http://neos_supabase_gateway:8000"
        passHostHeader: true

    neos-app-production-service:
      loadBalancer:
        servers:
          # Swapped dynamically by deployment script (blue vs green)
          - url: "http://neos-app-blue:80"
        passHostHeader: true

tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
      curvePreferences:
        - CurveP256
        - CurveP384
        - X25519
      preferServerCipherSuites: true
