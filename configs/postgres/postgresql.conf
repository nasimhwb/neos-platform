# ==============================================================================
# POSTGRESQL TUNED CONFIGURATION FOR PRODUCTION VPS (4GB RAM / SSD)
# ==============================================================================
# Customized for a standard VPS running Neos ERP, CRM, HRMS, and Billing.

# Connection Settings
listen_addresses = '*'
max_connections = 100
superuser_reserved_connections = 3

# Memory Settings
shared_buffers = 1GB                   # 25% of total RAM (4GB)
work_mem = 10MB                        # Memory per query operation
maintenance_work_mem = 256MB           # Memory for index creation, vacuum
effective_cache_size = 3GB             # 75% of total RAM (4GB)
huge_pages = off

# Write-Ahead Log (WAL)
wal_level = replica
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9     # Write WAL checkpoint smoothly
max_wal_size = 4GB
min_wal_size = 1GB
wal_buffers = 16MB                     # Auto-tuned generally, but set explicitly

# Query Planner Settings
random_page_cost = 1.1                 # Optimized for SSDs (Default is 4.0 for HDDs)
effective_io_concurrency = 200         # For SSDs
default_statistics_target = 100

# Logging Configurations (Useful for Loki / Promtail troubleshooting)
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 250        # Log any query taking longer than 250ms

# Autovacuum Settings (Crucial for high write databases)
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50

# Client Connection Defaults
datestyle = 'iso, ymd'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
