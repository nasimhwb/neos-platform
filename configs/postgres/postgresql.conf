# ==============================================================================
# POSTGRESQL TUNED CONFIGURATION FOR PRODUCTION VPS (4GB HOST / 1.5GB CONTAINER)
# ==============================================================================
# Customized for a Hostinger KVM2 VPS node running shared SaaS apps.

# Connection Settings
listen_addresses = '*'
max_connections = 100
superuser_reserved_connections = 3

# Memory Settings (Tuned for 1.5GB Container RAM Limit)
shared_buffers = 384MB                 # ~25% of container RAM limit
work_mem = 4MB                         # Memory per sorting/hash operation
maintenance_work_mem = 128MB           # Memory for index creation, vacuum
effective_cache_size = 1GB             # Estimate of total RAM available for caching
huge_pages = off

# Write-Ahead Log (WAL) Tuning
wal_level = replica
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9     # Spread checkpoint writes over 90% of duration
max_wal_size = 2GB                     # WAL size cap
min_wal_size = 512MB
wal_buffers = 16MB                     # Explicit buffer allocations

# Query Planner Settings (SSD Optimized)
random_page_cost = 1.1                 # Low seek cost for SSDs (Default 4.0)
effective_io_concurrency = 200         # High concurrent reads on NVMe SSD
default_statistics_target = 100

# SSL Configuration (SSL-Ready)
# To enable production SSL, uncomment the following lines and ensure certificates 
# are correctly mounted in compose.database.yml with pg-user ownership (UID 70).
# ssl = on
# ssl_cert_file = '/etc/postgresql/ssl/fullchain.pem'
# ssl_key_file = '/etc/postgresql/ssl/privkey.pem'

# Logging Configurations (Optimized for Loki/Promtail collection)
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 250        # Log slow queries taking > 250ms

# Autovacuum Settings (Crucial for active ERP/CRM write loads)
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50

# Client Connection Defaults
datestyle = 'iso, ymd'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
