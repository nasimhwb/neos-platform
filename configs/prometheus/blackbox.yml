# ==============================================================================
# PROMETHEUS BLACKBOX EXPORTER MODULE CONFIGURATION
# ==============================================================================

modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: [] # Defaults to 2xx status codes
      method: GET
      follow_redirects: true
      fail_if_ssl: false
      fail_if_not_ssl: false
      preferred_ip_protocol: ip4
      tls_config:
        insecure_skip_verify: false # Enforces certificate validation!
