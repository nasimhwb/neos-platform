global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load alerting rules files
rule_files:
  - "alert.rules.yml"

# Scrape configurations
scrape_configs:
  # 1. Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Host VPS Metrics (Node Exporter)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # 3. Container Metrics (cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # 4. Alerts Dispatcher (Alertmanager Self)
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  # 5. Database Exporter
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # 6. Redis Exporter
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
      
  # 7. Object Storage (MinIO Cluster Metrics)
  - job_name: 'minio'
    metrics_path: '/minio/v2/metrics/cluster'
    static_configs:
      - targets: ['object-store:9000']

  # 8. Ingress Proxy (Traefik Metrics)
  - job_name: 'traefik'
    static_configs:
      - targets: ['reverse-proxy:8082']

  # 9. Blackbox Exporter (SSL & HTTP Endpoint Probes)
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://reverse-proxy:80  # HTTP redirect validation
          - https://erp.neos-platform.local
          - https://s3.neos-platform.local
          - https://monitor.neos-platform.local
          - https://status.neos-platform.local
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # 10. Application Services (Add your apps here when they expose metrics)
  # - job_name: 'neos-erp'
  #   metrics_path: '/actuator/prometheus' # or '/metrics'
  #   static_configs:
  #     - targets: ['neos-erp-app:8000']
