global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Scrape configurations
scrape_configs:
  # 1. Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Host VPS Metrics (Node Exporter)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # 3. Container Metrics (cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # 4. Alerts Dispatcher (Alertmanager Self)
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  # 5. Database Exporter
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # 6. Redis Exporter
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  # 7. Application Services (Add your apps here when they expose metrics)
  # - job_name: 'neos-erp'
  #   metrics_path: '/actuator/prometheus' # or '/metrics'
  #   static_configs:
  #     - targets: ['neos-erp-app:8000']
