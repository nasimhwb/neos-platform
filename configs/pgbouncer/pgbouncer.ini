# ==============================================================================
# PGBOUNCER TUNED CONFIGURATION FOR PRODUCTION PLATFORM
# ==============================================================================

[databases]
# Wildcard database mapping: routes all databases to the Postgres backend
* = host=db port=5432

[pgbouncer]
# Ingress and Ports
listen_addr = *
listen_port = 6432

# Authentication
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

# Admin and Stats access
admin_users = postgres
stats_users = postgres, postgres_exporter

# Logging (outputs directly to stdout/stderr in container)
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

# Connection Pool Settings
# Transaction pooling is optimized for API-heavy stateless web apps
pool_mode = transaction

# Maximum user connections to PgBouncer
max_client_conn = 250

# Default size of connection pool per user/db pair
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5

# Maximum connections to backend PostgreSQL across all pools
max_db_connections = 80
