# ==============================================================================
# REDIS 8 TUNED CONFIGURATION FOR PRODUCTION PLATFORM
# ==============================================================================
# Optimized for high-throughput caching and session storage on 4GB host.

# Network Settings
bind 0.0.0.0
port 6379
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Security Settings
# Password is set via CLI argument '--requirepass' at startup in compose file.

# Memory Management (Tuned for 512MB RAM Limit)
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence: Dual RDB Snapshotting & AOF Journaling
# 1. RDB (Snapshotting) configuration
# Save the DB on disk if:
#   - 900 seconds (15 min) if at least 1 key changed
#   - 300 seconds (5 min) if at least 10 keys changed
#   - 60 seconds if at least 10000 keys changed
save 900 1
save 300 10
save 60 10000

rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# 2. AOF (Append-Only File) configuration
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# General Optimizations
databases 16
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes
