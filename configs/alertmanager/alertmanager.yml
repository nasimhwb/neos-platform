global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'slack-notifications'

receivers:
  - name: 'slack-notifications'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK_PLACEHOLDER'
        channel: '#neos-alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] Neos Infrastructure Alert: {{ .CommonLabels.alertname }}'
        text: >-
          *Alert Details:*
          • *Description:* {{ .CommonAnnotations.description }}
          • *Severity:* {{ .CommonLabels.severity }}
          • *Container:* {{ .CommonLabels.container }}
          • *Active since:* {{ .GroupLabels.active_since }}
