version: '3.8'

services:
  neos_app:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PLATFORM_PROVIDER: ${NEXT_PUBLIC_PLATFORM_PROVIDER:-self-hosted}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://supabase.neosfacility.com}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: neos_app:latest
    container_name: neos_app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_PLATFORM_NAME: ${NEXT_PUBLIC_PLATFORM_NAME:-NEOS Platform}
      NEXT_PUBLIC_BASE_DOMAIN: ${BASE_DOMAIN:-neosfacility.com}
      NEXT_PUBLIC_PLATFORM_PROVIDER: ${NEXT_PUBLIC_PLATFORM_PROVIDER:-self-hosted}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://supabase.neosfacility.com}
      SUPABASE_URL: ${SUPABASE_URL:-https://supabase.neosfacility.com}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: 6432
      POSTGRES_SUPERUSER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      REDIS_HOST: cache
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_HOST: object-store
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/neos/shared:/srv/neos/shared:ro
    networks:
      - neos-public
      - neos-private
      - neos-monitoring
      - neos-database
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.neos-app.rule=Host(`${WEBAPP_DOMAIN:-webapp.neosfacility.com}`)"
      - "traefik.http.routers.neos-app.entrypoints=websecure"
      - "traefik.http.routers.neos-app.tls=true"
      - "traefik.http.routers.neos-app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.neos-app.middlewares=security-headers@file,compression@file,rate-limit@file"
      - "traefik.http.services.neos-app.loadbalancer.server.port=3000"

networks:
  neos-public:
    name: neos-public
    external: true
  neos-private:
    name: neos-private
    external: true
  neos-monitoring:
    name: neos-monitoring
    external: true
  neos-database:
    name: neos-database
    external: true
