version: '3.8'

services:
  # ------------------------------------------------------------------------------
  # Object Storage Engine (MinIO)
  # ------------------------------------------------------------------------------
  object-store:
    image: minio/minio:${MINIO_VERSION:-RELEASE.2024-06-06T09-36-42Z}
    container_name: neos_minio
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Allow Prometheus to collect cluster metrics anonymously on private network
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - neos-storage
      - neos-monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ------------------------------------------------------------------------------
  # Bucket & Policy Auto-initializer (MinIO Client Sidecar)
  # ------------------------------------------------------------------------------
  minio-init:
    image: minio/mc:${MC_VERSION:-RELEASE.2024-05-09T17-04-24Z}
    container_name: neos_minio_init
    depends_on:
      object-store:
        condition: service_healthy
    volumes:
      - ../configs/minio/init.sh:/init.sh:ro
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      ERP_S3_PASSWORD: ${ERP_S3_PASSWORD}
      INVENTORY_S3_PASSWORD: ${INVENTORY_S3_PASSWORD}
      AI_S3_PASSWORD: ${AI_S3_PASSWORD}
      SUPABASE_S3_PASSWORD: ${SUPABASE_S3_PASSWORD}
    entrypoint: /bin/sh -c "chmod +x /init.sh && /init.sh"
    networks:
      - neos-storage
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
