version: '3.8'

services:
  db:
    image: postgres:${POSTGRES_VERSION:-16.3-alpine}
    container_name: neos_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../configs/postgres/init-scripts:/docker-entrypoint-initdb.d
      - ../configs/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:${REDIS_VERSION:-7.2-alpine}
    container_name: neos_redis
    restart: always
    volumes:
      - redis_data:/data
      - ../configs/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass "${REDIS_PASSWORD}"
      --maxmemory "${REDIS_MAXMEMORY:-512mb}"
      --maxmemory-policy "${REDIS_MAXMEMORY_POLICY:-allkeys-lru}"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
