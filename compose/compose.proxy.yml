version: '3.8'

services:
  reverse-proxy:
    image: traefik:${TRAEFIK_VERSION:-v3.0}
    container_name: neos_traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - DOCKER_API_VERSION=1.40
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # UDP binding is required for HTTP/3 (QUIC)
    volumes:
      # Read-only mount of Docker socket to read container labels dynamically
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../configs/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../configs/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - /srv/neos/shared/ssl:/letsencrypt
    networks:
      - neos-public
      - neos-private
      - neos-storage
      - neos-monitoring
    healthcheck:
      # Built-in Traefik CLI healthcheck uses the internal ping configurations
      test: ["CMD", "traefik", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
      labels:
        # Secure the Traefik administrative dashboard
        - "traefik.enable=true"
        - "traefik.http.routers.dashboard.rule=Host(`traefik.${BASE_DOMAIN:-neos-platform.local}`)"
        - "traefik.http.routers.dashboard.entrypoints=websecure"
        - "traefik.http.routers.dashboard.tls=true"
        - "traefik.http.routers.dashboard.service=api@internal"
        # Attach rate-limiting, gzip compression, security headers, and basic-auth
        - "traefik.http.routers.dashboard.middlewares=security-headers@file,compression@file,rate-limit@file,dashboard-auth@file"
        - "traefik.http.services.dashboard.loadbalancer.server.port=8082"
