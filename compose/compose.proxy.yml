version: '3.8'

services:
  reverse-proxy:
    build:
      context: ../services/nginx
      dockerfile: Dockerfile
    container_name: neos_nginx
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../configs/nginx/conf.d:/etc/nginx/conf.d:ro
      - /srv/neos/shared/ssl:/etc/letsencrypt
      - /srv/neos/shared/www:/var/www/html
    networks:
      - neos-public
      - neos-private
      - neos-storage
      - neos-monitoring
    healthcheck:
      test: ["CMD-SHELL", "curl -I http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
