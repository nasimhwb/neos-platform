version: '3.8'

services:
  # Portainer Community Edition for secure GUI container management
  portainer:
    image: portainer/portainer-ce:${PORTAINER_VERSION:-2.20.3-alpine}
    container_name: neos_portainer
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    networks:
      - backend
    # Portainer is not exposed directly. Accessible via proxy (configured internally).
