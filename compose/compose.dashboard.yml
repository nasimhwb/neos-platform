version: '3.8'

services:
  # ------------------------------------------------------------------------------
  # NEOS Platform Dashboard
  # Next.js 15 control center for the entire platform
  # ------------------------------------------------------------------------------
  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    image: neos_dashboard:latest
    container_name: neos_dashboard
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_PLATFORM_NAME: ${NEXT_PUBLIC_PLATFORM_NAME:-NEOS Platform}
      NEXT_PUBLIC_BASE_DOMAIN: ${BASE_DOMAIN:-neos-platform.local}
      # Core platform connection configs
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_SUPERUSER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      REDIS_HOST: cache
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_HOST: object-store
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      PROMETHEUS_HOST: prometheus
      PROMETHEUS_PORT: 9090
      ALERTMANAGER_HOST: alertmanager
      ALERTMANAGER_PORT: 9093
      LOKI_HOST: loki
      LOKI_PORT: 3100
    networks:
      - neos-private
      - neos-monitoring
      - neos-database
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.dashboard-ui.rule=Host(`dashboard.${BASE_DOMAIN:-neos-platform.local}`)"
        - "traefik.http.routers.dashboard-ui.entrypoints=websecure"
        - "traefik.http.routers.dashboard-ui.tls=true"
        - "traefik.http.routers.dashboard-ui.middlewares=security-headers@file,compression@file,rate-limit@file"
        - "traefik.http.services.dashboard-ui.loadbalancer.server.port=3000"
