version: '3.8'

services:
  # ------------------------------------------------------------------------------
  # Uptime Kuma (Service uptime and status checker)
  # ------------------------------------------------------------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.11-alpine
    container_name: neos_uptime_kuma
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - neos-public
      - neos-private
      - neos-monitoring
    healthcheck:
      test: ["CMD", "node", "extra/healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.kuma.rule=Host(`${STATUS_DOMAIN:-status.neos-platform.local}`)"
        - "traefik.http.routers.kuma.entrypoints=websecure"
        - "traefik.http.routers.kuma.tls=true"
        - "traefik.http.routers.kuma.tls.certresolver=letsencrypt"
        - "traefik.http.routers.kuma.middlewares=security-headers@file,compression@file,rate-limit@file"
        - "traefik.http.services.kuma.loadbalancer.server.port=3001"
    profiles:
      - infrastructure

