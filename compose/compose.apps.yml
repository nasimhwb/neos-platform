version: '3.8'

services:
  # ------------------------------------------------------------------------------
  # Uptime Kuma (Service uptime and status checker)
  # ------------------------------------------------------------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.11-alpine
    container_name: neos_uptime_kuma
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - uptime_kuma_data:/app/data
    networks:
      - neos-public
      - neos-private
      - neos-monitoring
    healthcheck:
      test: ["CMD", "node", "extra/healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 128M
    profiles:
      - infrastructure

  # ------------------------------------------------------------------------------
  # Application Placeholders (SaaS Products)
  # ------------------------------------------------------------------------------

  # 1. Neos ERP
  erp:
    image: nginx:1.26-alpine
    container_name: neos_erp_app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - DATABASE_URL=postgres://erp_user:${ERP_DB_PASSWORD}@db:5432/neos_erp
      - REDIS_URL=redis://:ChangeThisToASuperSecureRedisPassword456!@cache:6379/0
      - S3_ENDPOINT=object-store:9000
    networks:
      - neos-private
      - neos-database
      - neos-storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    profiles:
      - apps

