    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - DATABASE_URL=postgres://erp_user:${ERP_DB_PASSWORD}@db:5432/neos_erp
      - REDIS_URL=redis://:ChangeThisToASuperSecureRedisPassword456!@cache:6379/0
      - S3_ENDPOINT=object-store:9000
    networks:
      - neos-private
      - neos-database
      - neos-storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.erp.rule=Host(`erp.${BASE_DOMAIN:-neos-platform.local}`)"
        - "traefik.http.routers.erp.entrypoints=websecure"
        - "traefik.http.routers.erp.tls=true"
        - "traefik.http.routers.erp.middlewares=security-headers@file,compression@file,rate-limit@file"
        - "traefik.http.services.erp.loadbalancer.server.port=80"
    profiles:
