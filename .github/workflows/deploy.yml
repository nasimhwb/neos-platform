name: Deploy NEOS Application

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy neos_app to Hostinger VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Key & Deploy
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          HOST: 200.97.161.179
          USER: nasim
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "=== Testing SSH connection to $USER@$HOST ==="
          TARGET_USER="$USER"
          if ! ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "$TARGET_USER@$HOST" "uptime" 2>/dev/null; then
            echo "Failed as $USER, trying root@$HOST..."
            TARGET_USER="root"
          fi

          echo "=== Executing deployment commands as $TARGET_USER ==="
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "$TARGET_USER@$HOST" 'bash -s' <<'EOF'
            echo "=== Step 1: Navigating to platform directory ==="
            cd /srv/neos/neos-platform || cd /srv/neos/current || exit 1
            
            echo "=== Step 2: Fetching latest repository updates from origin/master ==="
            git fetch --all --prune || git fetch origin master || true
            git checkout master || true
            git reset --hard origin/master || true
            
            echo "=== Step 3: Verifying Traefik configuration file ==="
            ls -la configs/traefik/dynamic.yml
            cat configs/traefik/dynamic.yml | grep -A 10 "supabase-subdomain-router" || true
            
            echo "=== Step 4: Syncing dynamic.yml to /srv/neos/current if symlinked ==="
            if [ -d "/srv/neos/current/configs/traefik" ]; then
              cp -f configs/traefik/dynamic.yml /srv/neos/current/configs/traefik/dynamic.yml || true
            fi

            echo "=== Step 5: Checking containers status ==="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | grep -E "neos_app|neos_traefik|neos_supabase" || true
            
            echo "=========================================================================="
            echo "=== DEPLOYMENT EXECUTION COMPLETED"
            echo "=========================================================================="
          EOF
