name: Deploy NEOS Application

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy neos_app to Hostinger VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Production Deployment & Verification
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: GITHUB_SHA,GITHUB_REF_NAME
          script_stop_on_error: false
          script: |
            echo "=========================================================================="
            echo "=== NEOS PLATFORM PRODUCTION DEPLOYMENT"
            echo "=========================================================================="
            cd /srv/neos/neos-platform || exit 1
            
            echo "--- Current Git Status on VPS ---"
            git status
            
            echo "--- Fetching Updates ---"
            git fetch --all --prune
            git checkout master || git checkout -B master origin/master
            git reset --hard origin/master
            
            echo "--- Verifying configs/traefik/dynamic.yml ---"
            grep -A 10 "supabase-subdomain-router" configs/traefik/dynamic.yml || echo "WARNING: router not found"
            
            echo "--- Syncing to /srv/neos/current if symlinked ---"
            if [ -d "/srv/neos/current/configs/traefik" ]; then
              cp -f configs/traefik/dynamic.yml /srv/neos/current/configs/traefik/dynamic.yml || true
            fi
            
            echo "--- Container Status ---"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | grep -E "neos_traefik|neos_supabase|neos_app" || true
            
            echo "=========================================================================="
            echo "=== DEPLOYMENT STEP FINISHED"
            echo "=========================================================================="
