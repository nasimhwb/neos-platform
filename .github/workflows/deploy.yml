name: CD Deploy Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allow manual deployment trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Atomic Release
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Connection
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Upload Source to VPS Staging
        run: |
          # SSH command to verify staging directory
          ssh -o StrictHostKeyChecking=no nasim@${{ secrets.VPS_HOST }} "mkdir -p /srv/neos/tmp/deploy-src"
          
          # Sync files to staging directory on VPS as nasim
          rsync -avz --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude 'backups/' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ nasim@${{ secrets.VPS_HOST }}:/srv/neos/tmp/deploy-src/

      - name: Remote Trigger Atomic Release Deployment
        run: |
          # Connect to VPS and execute the release runner
          ssh -o StrictHostKeyChecking=no nasim@${{ secrets.VPS_HOST }} "
            chmod +x /srv/neos/tmp/deploy-src/scripts/deploy-release.sh
            /srv/neos/tmp/deploy-src/scripts/deploy-release.sh
          "
