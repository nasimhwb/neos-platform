name: Deploy Shared Infrastructure

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Configurations
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose-v2

      - name: Validate Compose File Syntax
        run: |
          # Verify compose config combinations
          docker compose \
            -f compose/compose.base.yml \
            -f compose/compose.database.yml \
            -f compose/compose.storage.yml \
            -f compose/compose.monitoring.yml \
            -f compose/compose.proxy.yml \
            -f compose/compose.security.yml \
            -f compose/compose.apps.yml \
            config

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    name: Deploy to Hostinger VPS
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Connection
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Synchronize Files to VPS
        run: |
          # Rsync project directories to VPS path
          rsync -avz --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude 'backups/' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ root@${{ secrets.VPS_HOST }}:/srv/neos-platform/

      - name: Trigger Remote Infrastructure Deployment
        run: |
          # Connect to VPS and run compose deploy command
          ssh -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} "
            cd /srv/neos-platform
            # Recreate running containers to pick up config modifications
            make up
          "
